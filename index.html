<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La casta tiene miedo - web</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      line-height: 1.7;
    }

    h1 {
      color: #7ee787;
      font-size: 1.6rem;
      border-bottom: 1px solid #21262d;
      padding-bottom: 0.5rem;
    }

    h2 {
      color: #58a6ff;
      font-size: 1.2rem;
      margin-top: 2rem;
    }

    h3 {
      color: #8b949e;
      font-size: 1rem;
      margin-top: 1.5rem;
    }

    p { margin: 0.8rem 0; }

    /* ── Terminal ─────────────────────────────── */
    .terminal-window {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      overflow: hidden;
      margin: 1rem 0;
    }

    .terminal-header {
      background: #21262d;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot.red    { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green  { background: #28c840; }

    .terminal-title {
      margin-left: auto;
      margin-right: auto;
      font-size: 0.75rem;
      color: #8b949e;
    }

    .terminal-body {
      padding: 12px 16px;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.85rem;
      overflow-x: auto;
    }

    .prompt { color: #7ee787; }
    .cmd    { color: #c9d1d9; }
    .out    { color: #8b949e; }
    .comment { color: #6e7681; font-style: italic; }

    /* ── Destacados ───────────────────────────── */
    code {
      background: #21262d;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85em;
      color: #ffa657;
    }

    .nota {
      border-left: 3px solid #58a6ff;
      padding: 0.5rem 1rem;
      margin: 1rem 0;
      background: #161b22;
      border-radius: 0 6px 6px 0;
      font-size: 0.9rem;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #6e7681;
    }

    footer a { color: #58a6ff; }
  </style>
</head>
<body>

  <h1>La casta tiene miedo - web site</h1>
    <a href="https://www.partidodigital.com.ar/" target="_blank">
    <img src="https://image.thum.io/get/noanimate/width/300/https://www.partidodigital.com.ar/"
        alt="Partido Digital" width="300">
    </a>   
    <a href="https://municipiosargentinos.net/" target="_blank">
    <img src="https://image.thum.io/get/noanimate/width/300/https://municipiosargentinos.net/"
        alt="Municipios argentinos" width="300">
    </a>   
    <a href="https://www.facebook.com/lacastatienemiedo/" target="_blank">
    <img src="imgs/lctm.jpg" alt="La casta tiene miedo - en facebook" width="300">
    </a>   

  <footer>

  </footer>

</body>
</html>
